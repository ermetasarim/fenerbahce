<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fenerbahçe</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@560;700&family=Outfit:wght@380;500;640&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #17141a;
    --paper: #f4f1e8;
    --card: #fbf8f2;
    --line: rgba(23,20,26,.1);
    --muted: #6d675c;
    --live: #d10f1a;
    --fb: #00205b;
    --gold: #f7c600;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Outfit, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(820px 260px at 50% -80px, rgba(247,198,0,.34), transparent 62%),
      var(--paper);
  }
  .wrap { width: min(980px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 56px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 18px; }
  header h1 { margin: 0; font-family: "Barlow Condensed", sans-serif; font-size: 44px; letter-spacing: .02em; line-height: .9; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .clock { text-align: right; }
  .clock b { display: block; font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 500; }
  .clock span { color: var(--muted); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .head {
    display: flex; justify-content: space-between; align-items: center;
    color: #fff; padding: 16px 20px; border-radius: 18px 18px 0 0;
    background: linear-gradient(100deg, var(--fb), #0a3478 74%);
  }
  .head h2 { margin: 0; font-family: "Barlow Condensed", sans-serif; font-size: 34px; letter-spacing: .03em; }
  .head small { display: block; opacity: .78; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; margin-top: 2px; }
  .mark { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--gold); color: var(--gold); font-weight: 700; }
  .panel { background: var(--card); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 18px 18px; }
  .block { padding: 18px 20px 8px; }
  .label { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: pulse 1.4s infinite; }
  .dot.off { background: #9aa1ad; animation: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(209,15,26,0); } }
  .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; padding: 16px 0 6px; }
  .team { font-size: 22px; font-weight: 500; }
  .team.away { text-align: right; }
  .score { font-family: "Barlow Condensed", sans-serif; font-size: 84px; line-height: .85; color: var(--fb); text-align: center; }
  .min { margin-top: 6px; text-align: center; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; font-weight: 640; color: var(--live); }
  .min.idle { color: var(--muted); }
  .split { height: 1px; background: var(--line); margin: 4px 20px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 8px; text-align: left; border-bottom: 1px solid var(--line); }
  th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  tr.me td { font-weight: 640; background: rgba(0,32,91,.07); }
  tr.playing td:first-child { color: var(--live); }
  .res td:nth-child(3) { font-family: "Barlow Condensed", sans-serif; font-size: 20px; font-weight: 700; }
  .fix { width: 100%; border-collapse: collapse; }
  .fix td { border-bottom: 1px solid var(--line); padding: 12px 4px; vertical-align: middle; }
  .fix tr:last-child td { border-bottom: 0; }
  .fix .date { width: 64px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .fix .opp { font-weight: 500; }
  .fix .comp { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .fix .venue { text-align: right; font-weight: 640; color: var(--fb); }
  .w { color: #1d7a45; } .d { color: #9a7420; } .l { color: #b42318; }
  a { color: inherit; }
  @media (max-width: 700px) {
    header h1 { font-size: 32px; }
    .score { font-size: 62px; }
    .team { font-size: 16px; }
    th:nth-child(n+5):nth-child(-n+7), td:nth-child(n+5):nth-child(-n+7) { display: none; }
  }
</style>
</head>

      <div class="split"></div>
      <div class="block">
        <div class="label">Fikstür</div>
        <table class="fix"><tbody id="fixtures"></tbody></table>
      </div>
    </div>
  </section>
</div>

-4¬TP÷0¬~TR÷35¬TN÷Slovan Bratislava¬TM÷1¬TW÷0¬TDR÷0¬TL÷1¬TG÷1:6¬TPF÷-5¬TP÷0¬~TR÷36¬TN÷Bodo/Glimt¬TM÷1¬TW÷0¬TDR÷0¬TL÷1¬TG÷0:5¬TPF÷-5¬TP÷0¬`;
const FIX = [
  { date: "10/10", opp: "Rizespor", comp: "Süper Lig", venue: "Deplasman", stamp: 1791619200 },
  { date: "14/10", opp: "Aston Villa", comp: "Şampiyonlar Ligi", venue: "Deplasman", stamp: 1791975600 },
  { date: "17/10", opp: "Alanyaspor", comp: "Süper Lig", venue: "İç saha", stamp: 1792224000 },

  { date: "08/11", opp: "Çorum", comp: "Süper Lig", venue: "Deplasman", stamp: 1794117600 }
];
function fieldsOf(chunk) {
  const o = {};
  chunk.split("¬").forEach(pair => {
    const i = pair.indexOf("÷");
    if (i > 0) o[pair.slice(0, i)] = pair.slice(i + 1);
  });
  return o;
}
function parse(text) {
  const rows = [];
  let current = null;
  text.split("~").forEach(chunk => {
    const f = fieldsOf(chunk);
    if (f.TR) {
      const g = (f.TG || "0:0").split(":");
      current = { id: f.TI || "", name: f.TN, o: Number(f.TM || 0), w: Number(f.TW || 0), d: Number(f.TDR || 0), l: Number(f.TL || 0), gf: Number(g[0] || 0), ga: Number(g[1] || 0), gd: Number(f.TPF || 0), p: Number(f.TP || 0), results: [] };
      rows.push(current);
    } else if (current && f.LMJ) current.results.push(f);
  });
  rows.sort((a, b) => b.p - a.p || b.gd - a.gd || b.gf - a.gf);
  return { rows };
}
function keyOf(name) { return String(name || "").toLocaleLowerCase("tr-TR").replace(/[^a-z0-9çğıöşü]/g, ""); }
function isLive(r) {
  const s = (r.LMS || "").trim();
  return r.LMU === "live" || /^\d/.test(s) || /devam|canlı|iy/i.test(s);
}
function outcome(r) {
  const map = { w: ["w", "Galibiyet"], l: ["l", "Mağlubiyet"], d: ["d", "Beraberlik"] };
  return map[r.LMU] || ["d", "Beraberlik"];
}
function when(r) {
  if (!r.LMC) return "";
  const p = new Intl.DateTimeFormat("tr-TR", { timeZone: "Europe/Istanbul", day: "2-digit", month: "2-digit" }).formatToParts(new Date(Number(r.LMC) * 1000));
  return p.find(x => x.type === "day").value + "/" + p.find(x => x.type === "month").value;
}
function ours(name) { return /fenerbah/i.test(name); }
function paintFixtures(me) {
  const done = new Set((me.results || []).filter(r => r.LMU && r.LMU !== "upcoming" && !isLive(r)).map(r => keyOf(ours(r.LMJ) ? r.LMK : r.LMJ)));
  const live = (me.results || []).filter(isLive);
  const upcoming = (me.results || []).filter(r => r.LMU === "upcoming");
  const rows = FIX.filter(f => !done.has(keyOf(f.opp))).map(f => ({ ...f }));
  upcoming.forEach(r => {
    const opp = ours(r.LMJ) ? r.LMK : r.LMJ;
    const venue = ours(r.LMJ) ? "İç saha" : "Deplasman";
    const hit = rows.find(f => keyOf(f.opp) === keyOf(opp));
    if (hit) { hit.date = when(r) || hit.date; hit.venue = venue; hit.stamp = Number(r.LMC) || hit.stamp; }
    else rows.push({ date: when(r), opp, comp: "Süper Lig", venue, stamp: Number(r.LMC) || 0 });
  });
  live.forEach(r => {
    const opp = ours(r.LMJ) ? r.LMK : r.LMJ;
    const hit = rows.find(f => keyOf(f.opp) === keyOf(opp));
    if (hit) hit.venue = "Canlı";
  });
  rows.sort((a, b) => (a.stamp || 0) - (b.stamp || 0));
  document.getElementById("fixtures").innerHTML = rows.map(f => `<tr><td class="date">${f.date}</td><td><span class="opp">${f.opp}</span><span class="comp">${f.comp}</span></td><td class="venue">${f.venue}</td></tr>`).join("");
}
function tableHtml(rows) {
  return rows.map((r, i) => {
    const meCls = r.id === TEAM || /fenerbah/i.test(r.name) ? " me" : "";
    return `<tr class="${meCls.trim()}"><td>${i + 1}.</td><td>${r.name}</td><td class="n">${r.o}</td><td class="n">${r.w}</td><td class="n">${r.d}</td><td class="n">${r.l}</td><td class="n">${r.gf}</td><td class="n">${r.ga}</td><td class="n">${r.gd}</td><td class="n">${r.p}</td></tr>`;
  }).join("");
}
function paint(data) {
  const me = data.rows.find(r => r.id === TEAM) || data.rows.find(r => /fenerbah/i.test(r.name));
  const live = me && me.results.find(isLive);
  const done = me ? me.results.filter(r => r.LMU !== "upcoming" && !isLive(r) && r.LMF !== "") : [];
  const card = live || done[0];
  if (card) {
    document.getElementById("home").textContent = card.LMJ;
    document.getElementById("away").textContent = card.LMK;
    document.getElementById("score").textContent = (card.LMF || "0") + " – " + (card.LMG || "0");
    document.getElementById("min").textContent = live ? (card.LMS || "Canlı") : "Maç sonu";
    document.getElementById("min").className = "min" + (live ? "" : " idle");
    document.getElementById("dot").className = "dot" + (live ? "" : " off");
    document.getElementById("kicker").textContent = live ? "Canlı maç" : "Son maç";
  }
  document.getElementById("results").innerHTML = done.map(r => {
    const [cls, word] = outcome(r);
    const opp = ours(r.LMJ) ? r.LMK : r.LMJ;
    return `<tr><td>${when(r)}</td><td>${opp}</td><td>${r.LMF}-${r.LMG}</td><td class="${cls}">${word}</td></tr>`;
  }).join("");
  const playing = new Set();
  data.rows.forEach(row => row.results.filter(isLive).forEach(() => playing.add(row.name)));
  document.getElementById("table").innerHTML = tableHtml(data.rows);
  if (me) paintFixtures(me);
}
function paintCl(data) {
  document.getElementById("cl-table").innerHTML = tableHtml(data.rows);
}
async function pull(url) {
  const res = await fetch(url, { cache: "no-store", headers: { "x-fsign": SIGN } });
  if (!res.ok) return "";
  return res.text();
}
async function refresh() {
  try {
    const text = await pull(FEED);
    if (text.includes("TN")) paint(parse(text));
  } catch (e) {}
  try {
    const text = await pull(CL_FEED);
    if (text.includes("TN")) paintCl(parse(text));
  } catch (e) {}
}
function tick() {
  document.getElementById("clock").textContent = new Intl.DateTimeFormat("tr-TR", {
    timeZone: "Europe/Istanbul", hour: "2-digit", minute: "2-digit", second: "2-digit"
  }).format(new Date());
}
paint(parse(FALLBACK));
paintCl(parse(CL_FALLBACK));
tick();
setInterval(tick, 1000);
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
